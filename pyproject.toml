[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "daia-coordinator"
version = "0.1.0"
description = "Evidence-gated coordination for voluntarily contributed AI-agent work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.1,<51",
  "fastapi>=0.128.2,<1",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2,<10", "httpx>=0.28.1,<1"]
mcp = ["mcp==2.2.0"]
postgres = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
daia = "daia.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/daia"]

[tool.ruff]
line-length = 100
target-version = "py312"
