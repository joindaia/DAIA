name: Reference checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows HTTP/process tests need room before the required history scan.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test and scan the proposed source, not GitHub-generated merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install reference dependencies
        run: |
          python -m pip install uv==0.12.11
          uv sync --frozen --extra dev --extra mcp
      - name: Install Nginx for Linux gateway integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
      - name: Unit and HTTP tests
        env:
          DAIA_REQUIRE_NGINX: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: uv run --frozen --extra dev --extra mcp python -m pytest -q --durations=15
      - name: Deterministic demonstration
        run: uv run --frozen --extra dev --extra mcp python -m daia.cli demo
      - name: Signed receipt recovery after process restart
        run: uv run --frozen --extra dev --extra mcp python -B scripts/probe_recovery.py
      - name: Compile syntax
        run: uv run --frozen --extra dev --extra mcp python -m compileall -q src scripts tests
      - name: Source and history privacy tripwire
        run: uv run --frozen --extra dev --extra mcp python scripts/privacy_guard.py --history
  website:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test and scan the proposed source, not GitHub-generated merge metadata.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: npm ci
      - name: Build website
        run: npm run build
# Deliberately no secrets, deployment, artifact uploads, self-hosted runner or pull_request_target.
# License review and a fresh vulnerability audit remain release gates.
